openapi: 3.1.0
info:
  title: Parcel Intelligence API
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      description: Register a new user account.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: Authenticate with email and password to receive JWT tokens.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh Token Endpoint
      description: Obtain a new access token using a valid refresh token.
      operationId: refresh_token_endpoint_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get Current User Profile
      description: Retrieve profile of the currently authenticated user.
      operationId: get_current_user_profile_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/v1/parcels:
    get:
      tags:
      - parcels
      summary: Search Parcels
      description: Search and filter cadastral land parcels across administrative
        hierarchies.
      operationId: search_parcels_api_v1_parcels_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by ULPIN, Survey Number, Khasra Number, or Patta Number
          title: Q
        description: Search by ULPIN, Survey Number, Khasra Number, or Patta Number
      - name: state_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by State ID
          title: State Id
        description: Filter by State ID
      - name: district_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by District ID
          title: District Id
        description: Filter by District ID
      - name: village_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by Village ID
          title: Village Id
        description: Filter by Village ID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParcelSummary'
                title: Response Search Parcels Api V1 Parcels Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}:
    get:
      tags:
      - parcels
      summary: Get Parcel Detail
      description: Retrieve comprehensive cadastral parcel details including GeoJSON
        polygon boundary.
      operationId: get_parcel_detail_api_v1_parcels__ulpin__get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}/ror:
    get:
      tags:
      - parcels
      summary: Get Parcel Ror
      description: Retrieve Record of Rights (RoR / Khatauni) ownership records for
        a parcel.
      operationId: get_parcel_ror_api_v1_parcels__ulpin__ror_get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoRItem'
                title: Response Get Parcel Ror Api V1 Parcels  Ulpin  Ror Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}/registrations:
    get:
      tags:
      - parcels
      summary: Get Parcel Registrations
      description: Retrieve Sub-Registrar registered deed transactions for a parcel.
      operationId: get_parcel_registrations_api_v1_parcels__ulpin__registrations_get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationItem'
                title: Response Get Parcel Registrations Api V1 Parcels  Ulpin  Registrations
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}/encumbrances:
    get:
      tags:
      - parcels
      summary: Get Parcel Encumbrances
      description: Retrieve bank mortgages, judicial liens, or litigation claims on
        a parcel.
      operationId: get_parcel_encumbrances_api_v1_parcels__ulpin__encumbrances_get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EncumbranceItem'
                title: Response Get Parcel Encumbrances Api V1 Parcels  Ulpin  Encumbrances
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}/mutations:
    get:
      tags:
      - parcels
      summary: Get Parcel Mutations
      description: Retrieve land title mutation and transfer history for a parcel.
      operationId: get_parcel_mutations_api_v1_parcels__ulpin__mutations_get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MutationItem'
                title: Response Get Parcel Mutations Api V1 Parcels  Ulpin  Mutations
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}/building-permissions:
    get:
      tags:
      - parcels
      summary: Get Parcel Building Permissions
      description: Retrieve town planning sanctioned building plans and permissions.
      operationId: get_parcel_building_permissions_api_v1_parcels__ulpin__building_permissions_get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuildingPermissionItem'
                title: Response Get Parcel Building Permissions Api V1 Parcels  Ulpin  Building
                  Permissions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}/tax:
    get:
      tags:
      - parcels
      summary: Get Parcel Property Tax
      description: Retrieve municipal property tax assessments and payment statuses.
      operationId: get_parcel_property_tax_api_v1_parcels__ulpin__tax_get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyTaxItem'
                title: Response Get Parcel Property Tax Api V1 Parcels  Ulpin  Tax
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}/history:
    get:
      tags:
      - parcels
      summary: Get Parcel Combined History
      description: Retrieve an integrated chronological timeline merging registrations,
        mutations, and alerts.
      operationId: get_parcel_combined_history_api_v1_parcels__ulpin__history_get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParcelHistoryItem'
                title: Response Get Parcel Combined History Api V1 Parcels  Ulpin  History
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}/zoning-check:
    post:
      tags:
      - parcels
      summary: Check Parcel Zoning
      description: Perform spatial intersection check between parcel geometry and
        master plan zoning.
      operationId: check_parcel_zoning_api_v1_parcels__ulpin__zoning_check_post
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoningCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parcels/{ulpin}/intelligence:
    get:
      tags:
      - parcels
      summary: Get Parcel Intelligence
      description: Calculate and retrieve statutory dispute risk, title trust score,
        and explainable deductions.
      operationId: get_parcel_intelligence_api_v1_parcels__ulpin__intelligence_get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeIntelligenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit/{entity_type}/{entity_id}:
    get:
      tags:
      - audit
      summary: Get Audit Trail
      description: Retrieve immutable audit ledger blocks for any land title or legal
        entity.
      operationId: get_audit_trail_api_v1_audit__entity_type___entity_id__get
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
          title: Entity Type
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      - name: verify
        in: query
        required: false
        schema:
          type: boolean
          description: Cryptographically verify the SHA-256 chain integrity
          default: false
          title: Verify
        description: Cryptographically verify the SHA-256 chain integrity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Audit Trail Api V1 Audit  Entity Type   Entity
                  Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/consents:
    post:
      tags:
      - consents
      summary: Request Consent
      description: Submit a DPI Consent request to inspect sensitive parcel records.
      operationId: request_consent_api_v1_consents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/consents/{consent_id}:
    patch:
      tags:
      - consents
      summary: Handle Consent Action
      description: Approve or revoke a pending/active consent grant.
      operationId: handle_consent_action_api_v1_consents__consent_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: consent_id
        in: path
        required: true
        schema:
          type: integer
          title: Consent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentActionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/consents/mine:
    get:
      tags:
      - consents
      summary: Get My Consents
      description: List incoming and outgoing consent grants relevant to the current
        user.
      operationId: get_my_consents_api_v1_consents_mine_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConsentResponse'
                type: array
                title: Response Get My Consents Api V1 Consents Mine Get
      security:
      - HTTPBearer: []
  /api/v1/alerts:
    get:
      tags:
      - alerts
      summary: List Alerts
      description: List cadastral boundary shift and land use change alerts.
      operationId: list_alerts_api_v1_alerts_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertResponse'
                title: Response List Alerts Api V1 Alerts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/{alert_id}:
    patch:
      tags:
      - alerts
      summary: Update Alert Status
      description: Update change detection alert status (restricted to officers/administrators).
      operationId: update_alert_status_api_v1_alerts__alert_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: integer
          title: Alert Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/grievances:
    post:
      tags:
      - grievances
      summary: Submit Grievance
      description: Submit a citizen land grievance or dispute report.
      operationId: submit_grievance_api_v1_grievances_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrievanceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - grievances
      summary: List Grievances
      description: Retrieve citizen grievances with role-based visibility.
      operationId: list_grievances_api_v1_grievances_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrievanceResponse'
                title: Response List Grievances Api V1 Grievances Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/grievances/{grievance_id}:
    patch:
      tags:
      - grievances
      summary: Update Grievance
      description: Update grievance resolution status and assign officer (revenue
        officers only).
      operationId: update_grievance_api_v1_grievances__grievance_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: grievance_id
        in: path
        required: true
        schema:
          type: integer
          title: Grievance Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrievanceStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dev/api-keys:
    post:
      tags:
      - developer
      summary: Generate Api Key
      description: Generate a new Developer Sandbox API Key for external integrations.
      operationId: generate_api_key_api_v1_dev_api_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/public/parcels/{ulpin}:
    get:
      tags:
      - developer
      summary: Get Public Parcel Data
      description: Public, sanitized parcel lookup endpoint (excludes citizen PII
        and sensitive legal encumbrances).
      operationId: get_public_parcel_data_api_v1_public_parcels__ulpin__get
      parameters:
      - name: ulpin
        in: path
        required: true
        schema:
          type: string
          title: Ulpin
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          description: Developer Sandbox API Key
          title: X-Api-Key
        description: Developer Sandbox API Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicParcelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: Basic health-check endpoint for load balancers and container probes.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Check Health Get
  /:
    get:
      tags:
      - root
      summary: Root
      description: Root info endpoint directing to API documentation.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
components:
  schemas:
    AlertResponse:
      properties:
        id:
          type: integer
          title: Id
        parcel_id:
          type: integer
          title: Parcel Id
        ulpin:
          type: string
          title: Ulpin
        alert_type:
          type: string
          title: Alert Type
        confidence_score:
          type: number
          title: Confidence Score
        source:
          type: string
          title: Source
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - parcel_id
      - ulpin
      - alert_type
      - confidence_score
      - source
      - status
      - created_at
      title: AlertResponse
    AlertStatusUpdate:
      properties:
        status:
          type: string
          pattern: ^(unresolved|investigating|dismissed|resolved)$
          title: Status
      type: object
      required:
      - status
      title: AlertStatusUpdate
    ApiKeyCreateRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 3
          title: Name
          description: Developer or application name
        rate_limit_per_minute:
          anyOf:
          - type: integer
            maximum: 1000.0
            minimum: 1.0
          - type: 'null'
          title: Rate Limit Per Minute
          default: 60
      type: object
      required:
      - name
      title: ApiKeyCreateRequest
    ApiKeyCreateResponse:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        raw_api_key:
          type: string
          title: Raw Api Key
        rate_limit_per_minute:
          type: integer
          title: Rate Limit Per Minute
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - raw_api_key
      - rate_limit_per_minute
      - created_at
      title: ApiKeyCreateResponse
    BuildingPermissionItem:
      properties:
        id:
          type: integer
          title: Id
        application_number:
          type: string
          title: Application Number
        approved_use:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved Use
        built_up_area_sqm:
          anyOf:
          - type: number
          - type: 'null'
          title: Built Up Area Sqm
        floors_approved:
          type: integer
          title: Floors Approved
        sanction_date:
          type: string
          format: date
          title: Sanction Date
        status:
          type: string
          title: Status
        plan_document_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan Document Ref
      type: object
      required:
      - id
      - application_number
      - floors_approved
